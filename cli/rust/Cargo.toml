[package]
name = "hyburn"
version = "0.2.0"
edition = "2021"
description = "Hyburn miner, Rust implementation"

[dependencies]
alloy = { version = "1", features = ["full", "signer-keystore"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
chrono = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
