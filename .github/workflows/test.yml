name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Detect website changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          changed = False
          if os.environ['EVENT_NAME'] == 'push':
              before = os.environ.get('BEFORE_SHA', '')
              if not before or set(before) == {'0'}:
                  changed = True
              else:
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', '-z', '--no-renames', before, os.environ['HEAD_SHA']],
                      capture_output=True, check=True)
                  paths = result.stdout.decode().split('\0')
                  changed = any(p.startswith('web/') or p == '.github/workflows/test.yml' for p in paths)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write(f'website={str(changed).lower()}\n')
          print('Website/deployment inputs changed:', changed)
          PY

  contracts:
    name: Contracts (tests + invariants)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check src test
      - run: forge build --sizes
      - run: forge test -vv

  web:
    name: Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:deployment
      - run: npm run build

  miners:
    name: Miner conformance (${{ matrix.lang }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            cmd: cli/python/.venv/bin/python cli/python/hyburn.py --yes
          - lang: node
            cmd: node cli/node/hyburn.mjs --yes
          - lang: go
            cmd: cli/go/hyburn --yes
          - lang: rust
            cmd: cli/rust/target/release/hyburn --yes
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv cli/python/.venv && cli/python/.venv/bin/pip install -r cli/python/requirements.txt
      - if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.lang == 'node'
        run: cd cli/node && npm ci && node --check hyburn.mjs
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go/go.sum
      - if: matrix.lang == 'go'
        run: cd cli/go && go build -o hyburn .
      - if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.lang == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli/rust
      - if: matrix.lang == 'rust'
        run: cd cli/rust && cargo build --release --locked
      - run: forge build
      - name: Deployment console regression (local Anvil only)
        if: matrix.lang == 'python'
        run: cli/python/.venv/bin/python -m unittest discover -s cli/conformance -p 'test_*.py'
      - name: Native shared TUI smoke and telemetry
        if: matrix.lang != 'python'
        run: |
          cli/python/.venv/bin/python cli/conformance/tui_native_smoke.py "${{ matrix.cmd }}"
          cli/python/.venv/bin/python cli/conformance/tui_telemetry.py "${{ matrix.cmd }}"
      - name: Cache boundary regression
        run: python3 cli/conformance/cache_boundary.py "${{ matrix.cmd }}"
      - name: Local-chain conformance
        run: cli/conformance/run.sh "${{ matrix.cmd }}"
      - name: Session recovery regression (local Anvil only)
        run: cli/python/.venv/bin/python cli/conformance/session_recovery.py "${{ matrix.cmd }}"

  deploy:
    name: Deploy website
    needs: [changes, contracts, web, miners]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'hyburnprotocol/hyburn' && needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hyburn.xyz
    concurrency:
      group: hyburn-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify deployment credentials
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Install pinned deployment CLI
        run: npm install --global vercel@59.16.0
      - name: Publish only if website inputs are still current
        run: |
          git fetch --no-tags origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- web/ .github/workflows/test.yml; then
            echo 'Newer website inputs exist; skipping obsolete deployment.'
            exit 0
          fi
          # `pull` queries team settings unavailable to project-only tokens.
          # Direct deploy supports project-only tokens and builds on Vercel
          # using this project's validated production environment.
          vercel deploy --yes --prod --token="$VERCEL_TOKEN"
